name: Tests and site

# On every push: run the tests. On main: rebuild the site from the stored data and forecast
# (no retraining), so changes to the pages go live without changing the published forecast.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.build.outputs.built }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Build the site from the stored forecast
        id: build
        run: |
          if [ -f data/reports/forecast_current.csv.gz ]; then python -m dpf.run site; echo "built=true" >> "$GITHUB_OUTPUT"; else echo "No forecast stored yet"; fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.build.outputs.built == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: test
    if: needs.test.outputs.built == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
