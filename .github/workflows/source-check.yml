name: Source check

# Confirms the Land Department data services answer from GitHub's servers. Runs weekly and on demand.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install requests
      - run: python -m dpf.sources.health
      - run: python -m dpf.sources.discover
